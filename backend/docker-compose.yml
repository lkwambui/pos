version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: swiftpos-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swiftpos
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: swiftpos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: swiftpos-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
