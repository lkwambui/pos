services:
  - type: web
    name: swiftpos-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PREFIX
        value: /api
      - key: APP_NAME
        value: SwiftPOS
      - key: DATABASE_URL
        fromDatabase:
          name: swiftpos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: swiftpos-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_CURRENCY
        value: KES
      - key: DEFAULT_TAX_RATE
        value: "16"
      - key: DEFAULT_TIMEZONE
        value: Africa/Nairobi

  - type: web
    name: swiftpos-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "18"

databases:
  - name: swiftpos-db
    databaseName: swiftpos
    plan: free
    ipAllowList: []

redis:
  - name: swiftpos-redis
    plan: free
    ipAllowList: []
